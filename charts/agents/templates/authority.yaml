apiVersion: apps/v1
kind: Deployment
metadata:
  name: authority
  namespace: authority
spec:
  replicas: 1
  selector:
    matchLabels:
      app: authority
  template:
    metadata:
      labels:
        app: authority
        type: agent
      annotations:
        "linkerd.io/inject" : enabled
    spec:
      serviceAccountName: job-creator-authority
      containers:
      - name: authority
        image: {{ .Values.dockerArtifactAccount }}/agent:{{ .Values.branchNameTag }}
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
        env:
        - name: SIDECAR_REPOSITORY_NAME
          value: {{ .Values.dockerArtifactAccount | quote }}
        - name: DYNAMOS_ENVIRONMENT
          value: local
        - name: DATA_STEWARD_NAME
          value: authority
        - name: MICROSERVICE_REPOSITORY_NAME
          value: {{ .Values.dockerArtifactAccount | quote }}
        - name: MICROSERVICE_TAG
          value: {{ .Values.branchNameTag | quote }}
        - name: OC_AGENT_HOST
          value: {{ .Values.tracingEndpoint }}
      - name: sidecar
        image: {{ .Values.dockerArtifactAccount }}/sidecar:{{ .Values.branchNameTag }}
        imagePullPolicy: IfNotPresent
        env:
        - name: AMQ_PASSWORD
          valueFrom:
            secretKeyRef:
              name: rabbit
              key: password
        - name: AMQ_USER
          value: normal_user
        - name: OC_AGENT_HOST
          value: {{ .Values.tracingEndpoint }}

---

apiVersion: v1
kind: Service
metadata:
  name: authority
  namespace: authority
spec:
  selector:
    app: authority
    type: agent
  ports:
    - name: http-authority-api
      protocol: TCP
      port: 8080
      targetPort: 8080
  type: ClusterIP

---

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: authority-ingress
  namespace: authority
  annotations:
    nginx.ingress.kubernetes.io/service-upstream: "true"
spec:
  ingressClassName: nginx
  rules:
  - host: authority.authority.svc.cluster.local
    http:
      paths:
      - pathType: Prefix
        path: "/agent/v1/vflTrainRequest/authority"
        backend:
          service:
            name: authority
            port:
              number: 8080

---

apiVersion: v1
kind: PersistentVolume
metadata:
  name: authority-pv
spec:
  capacity:
    storage: 10Gi
  storageClassName: standard
  accessModes:
    - ReadWriteMany
  hostPath:
      # local path on node
    path: "/mnt/data"
  persistentVolumeReclaimPolicy: Retain
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - authority

---

apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: authority-pvc
  namespace: authority
spec:
  volumeName: authority-pv
  accessModes:
    - ReadWriteOnce   # Needed for multiple pods to mount simultaneously
  resources:
    requests:
      storage: 5Gi    # Adjust size as needed
  storageClassName: standard
